# Fly.io deployment configuration
# https://fly.io/docs/reference/configuration/
#
# Replace "voice-selfcare" with your actual Fly.io app name.

app = 'voice-selfcare'
primary_region = 'sjc'

[build]

[env]
  PORT = "8080"

[[services]]
  http_checks = []
  internal_port = 8080
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
